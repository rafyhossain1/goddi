<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Paper background -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1e9d6"/>
      <stop offset="100%" stop-color="#e6dcc2"/>
    </linearGradient>
    <radialGradient id="warm" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#b8934a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b8934a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#a6291f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a6291f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#cool)"/>

  <!-- Corner stamps -->
  <g font-family="Special Elite, Courier New, monospace" fill="#6a594b" letter-spacing="3">
    <text x="50" y="55" font-size="18">১৪৩৩</text>
    <text x="1140" y="585" font-size="18" text-anchor="end">WARD 37</text>
  </g>

  <!-- Stamp seal — same geometry as favicon -->
  <g transform="translate(220 315)">
    <circle r="160" fill="#f1e9d6" stroke="#a6291f" stroke-width="6"/>
    <circle r="130" fill="none" stroke="#a6291f" stroke-width="2" stroke-dasharray="6 7" opacity="0.7"/>
    <text x="0" y="60" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="220" fill="#a6291f">গ</text>
  </g>

  <!-- Title block -->
  <g transform="translate(440 220)">
    <text x="0" y="0" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="130" fill="#1a1310">GODDI</text>
    <text x="0" y="92" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-weight="700" font-size="64" fill="#a6291f">গদি</text>
    <text x="0" y="170" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="26" fill="#3d322a">Ward 37. Five years.</text>
    <text x="0" y="208" font-family="DM Sans, system-ui, sans-serif" font-weight="500" font-size="26" fill="#3d322a">How long will you last?</text>
  </g>

  <!-- SBYC tag -->
  <text x="600" y="595" text-anchor="middle"
        font-family="Special Elite, Courier New, monospace" font-size="16"
        letter-spacing="4" fill="#6a594b">AN SBYC PRESENTATION</text>
</svg>
