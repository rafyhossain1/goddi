<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- ============================================================
       Goddi · গদি — Open Graph share preview (1200×630)
       Rendered to PNG via ImageMagick. Same paper/ink/stamped
       aesthetic as the game splash, redesigned to land as a polished
       social card when the link is pasted in WhatsApp/FB/Twitter.
       ============================================================ -->

  <defs>
    <radialGradient id="warmth" cx="20%" cy="20%" r="60%">
      <stop offset="0%"  stop-color="#b8934a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b8934a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rust" cx="80%" cy="85%" r="55%">
      <stop offset="0%"  stop-color="#a6291f" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a6291f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bdred" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f42a41" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#f42a41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f42a41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Paper base + warm + rust radial overlays -->
  <rect width="1200" height="630" fill="#f1e9d6"/>
  <rect width="1200" height="630" fill="url(#warmth)"/>
  <rect width="1200" height="630" fill="url(#rust)"/>

  <!-- BD-red disc behind the title (matches splash treatment) -->
  <circle cx="320" cy="280" r="230" fill="url(#bdred)"/>

  <!-- Top stamps (Bn year on left, ward on right) -->
  <g font-family="Special Elite, monospace" fill="#a6291f" opacity="0.7">
    <text x="60" y="62" font-size="20" letter-spacing="2">১৪৩৩</text>
    <text x="1140" y="62" font-size="20" letter-spacing="3" text-anchor="end">WARD 37</text>
  </g>

  <!-- Stamp box accents on top corners -->
  <rect x="48" y="38" width="68" height="32" fill="none"
        stroke="#a6291f" stroke-width="2" opacity="0.5"
        transform="rotate(-5 82 54)"/>
  <rect x="1062" y="38" width="100" height="32" fill="none"
        stroke="#a6291f" stroke-width="2" opacity="0.5"
        transform="rotate(4 1112 54)"/>

  <!-- ===== LEFT BLOCK: title ===== -->
  <text x="320" y="290" font-family="Hind Siliguri, sans-serif"
        font-size="220" font-weight="700" fill="#1a1310"
        text-anchor="middle">গদি</text>

  <text x="320" y="356" font-family="Special Elite, monospace"
        font-size="38" fill="#3d322a" letter-spacing="20"
        text-anchor="middle">GODDI</text>

  <!-- Flag-green accent bar -->
  <line x1="240" y1="380" x2="400" y2="380"
        stroke="#006a4e" stroke-width="3" opacity="0.85"/>

  <!-- ===== RIGHT BLOCK: tagline ===== -->
  <g text-anchor="start">
    <text x="600" y="170" font-family="Fraunces, Georgia, serif"
          font-size="50" font-weight="900" fill="#1a1310">
      Ward 37. Five years.
    </text>
    <text x="600" y="232" font-family="Fraunces, Georgia, serif"
          font-size="50" font-weight="900" fill="#a6291f">
      How long will you last?
    </text>

    <text x="600" y="310" font-family="Noto Sans Bengali, sans-serif"
          font-size="34" font-weight="700" fill="#1a1310">
      ওয়ার্ড ৩৭ · পাঁচ বছর
    </text>
    <text x="600" y="358" font-family="Noto Sans Bengali, sans-serif"
          font-size="32" font-weight="500" fill="#3d322a">
      কতদিন টিকবেন?
    </text>
  </g>

  <!-- Feature pill row (center-bottom) -->
  <g font-family="Special Elite, monospace" font-size="22" fill="#1a1310">
    <g transform="translate(280, 440)">
      <rect width="200" height="50" rx="25" fill="#f1e9d6"
            stroke="#1a1310" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle">BILINGUAL</text>
    </g>
    <g transform="translate(500, 440)">
      <rect width="150" height="50" rx="25" fill="#006a4e"
            stroke="#1a1310" stroke-width="2"/>
      <text x="75" y="33" text-anchor="middle" fill="#f1e9d6">FREE</text>
    </g>
    <g transform="translate(670, 440)">
      <rect width="260" height="50" rx="25" fill="#f1e9d6"
            stroke="#1a1310" stroke-width="2"/>
      <text x="130" y="33" text-anchor="middle">BROWSER · NO APP</text>
    </g>
  </g>

  <!-- SBYC presentation stamp (diagonal accent) -->
  <g transform="translate(940, 76) rotate(8)">
    <rect width="180" height="46" fill="none"
          stroke="#a6291f" stroke-width="2.5" opacity="0.6" rx="3"/>
    <text x="90" y="32" font-family="Special Elite, monospace"
          font-size="22" fill="#a6291f" opacity="0.85"
          text-anchor="middle" letter-spacing="3">EST · ২০২৬</text>
  </g>

  <!-- ===== BOTTOM BAND ===== -->
  <line x1="60" y1="540" x2="1140" y2="540"
        stroke="#1a1310" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <text x="60" y="592" font-family="Special Elite, monospace"
        font-size="32" fill="#1a1310" letter-spacing="2">goddi.sbyc.cloud</text>

  <text x="1140" y="592" font-family="Special Elite, monospace"
        font-size="20" fill="#3d322a" text-anchor="end"
        letter-spacing="3">AN SBYC PRESENTATION</text>
</svg>
