# Netlify deploy config for goddi.sbyc.cloud
# Static site — no build step.

[build]
  publish = "."

# Security headers — sane defaults for a static game with no auth.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "interest-cohort=()"
    # Allow self-scripts + Google Fonts; data: needed for inline SVG favicon
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://kafvftjcvnvtklqwanrm.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"

# Aggressive cache for static assets, keyed by Netlify's hash so cache busts
# automatically on each deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# index.html itself should never aggressively cache, so new deploys appear
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
