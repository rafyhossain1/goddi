# Netlify deploy config for goddi.sbyc.cloud
# Static site — no build step.

[build]
  publish = "."

# Security headers — sane defaults for a static game with no auth.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "interest-cohort=()"
    # Allow self-scripts + Google Fonts + Cloudflare Web Analytics beacon +
    # Cloudflare Turnstile (script + iframe widget); data: needed for inline
    # SVG favicon
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://kafvftjcvnvtklqwanrm.supabase.co https://cloudflareinsights.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"

# Aggressive cache for static assets, keyed by Netlify's hash so cache busts
# automatically on each deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    # No cache while we're still tuning the game post-launch. Browser
    # revalidates on each request (cheap — Netlify returns 304 if unchanged).
    # Revisit this in a few weeks once content stabilises; bump to 86400.
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# index.html itself should never aggressively cache, so new deploys appear
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker — must NEVER cache, must be served at root scope.
# Service-Worker-Allowed lets the SW control the whole site even if it's
# served from a sub-path (not our case here, but harmless to set).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control          = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest also never cached aggressively — icon/name updates should land.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Make /stats resolve to /stats.html so the admin dashboard has a clean URL
[[redirects]]
  from = "/stats"
  to   = "/stats.html"
  status = 200

# /rules → /rules.html — public lottery rules page
[[redirects]]
  from = "/rules"
  to   = "/rules.html"
  status = 200

# /about → /about.html — about page for the game
[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 200

# Block source/ops directories from being web-served. `publish = "."` would
# otherwise expose these as static files. force=true is REQUIRED so the rule
# overrides the real files that exist at these paths. The /sql files contain
# the admin password gate — must never be downloadable.
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
